<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klicker</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8b91a1; --accent:#4f8cff; --ok:#3ccf7a; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .hero { text-align: center; }
  .count { font-size: 72px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .count-label { color: var(--muted); margin-bottom: 20px; }
  button#click {
    width: 220px; height: 220px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: white; font-size: 28px; font-weight: 700;
    box-shadow: 0 8px 0 #2d5fc4; transition: transform .05s, box-shadow .05s, background .2s;
  }
  button#click:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #2d5fc4; }
  button#click:disabled { background: #3a3f4c; box-shadow: 0 8px 0 #262a33; cursor: not-allowed; }
  .msg { min-height: 24px; margin-top: 16px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .name { margin-top: 16px; display:flex; gap:8px; justify-content:center; align-items:center; color: var(--muted); }
  .name input { background:#0f1115; border:1px solid #2a2f3a; color:var(--text); border-radius:8px; padding:8px 10px; width: 180px; }
  .stats { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .stat-big { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  ol.records { margin:0; padding-left: 22px; }
  ol.records li { padding: 3px 0; font-variant-numeric: tabular-nums; }
  table { width:100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align:left; padding: 6px 8px; border-bottom: 1px solid #252935; }
  th { color: var(--muted); font-weight: 600; }
  .s-ok { color: var(--ok); } .s-bad { color: var(--bad); }
  .empty { color: var(--muted); }
  .setup { border: 1px solid #ffb84d; color: #ffd28a; }
  .setup code { background:#0f1115; padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Klicker</h1>
  <p class="sub">Ein Zähler für alle. Nach jedem Klick ist der Knopf für <b>5</b> Sekunden für <b>alle</b> gesperrt.</p>

  <section class="card setup" id="setup" hidden></section>

  <section class="card hero">
    <div class="count" id="total">–</div>
    <div class="count-label">Klicks insgesamt</div>
    <button id="click" disabled>+1</button>
    <div class="msg" id="msg"></div>
    <label class="name">Dein Name: <input id="name" maxlength="30" placeholder="Anonym"></label>
  </section>

  <div class="stats">
    <section class="card">
      <h2>Diese Stunde</h2>
      <div class="stat-big" id="this-hour">–</div>
    </section>
    <section class="card">
      <h2>Rekorde pro Stunde</h2>
      <ol class="records" id="records"><li class="empty">Noch keine Klicks</li></ol>
    </section>
  </div>

  <section class="card">
    <h2>Log (letzte 50 Versuche)</h2>
    <table>
      <thead><tr><th>Zeit</th><th>Name</th><th>Status</th></tr></thead>
      <tbody id="logs"><tr><td colspan="3" class="empty">Noch keine Einträge</td></tr></tbody>
    </table>
  </section>
</main>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getDatabase, ref, onValue, query, orderByKey, orderByValue, limitToLast,
  update, push, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

const COOLDOWN_MS = 5000, HOUR_MS = 3600000;
const $ = id => document.getElementById(id);
const btn = $('click'), msg = $('msg'), nameInput = $('name');

nameInput.value = localStorage.getItem('klicker-name') || '';
nameInput.addEventListener('input', () => localStorage.setItem('klicker-name', nameInput.value));

function showSetup(text) { const s = $('setup'); s.textContent = text; s.hidden = false; }

const cfg = window.FIREBASE_CONFIG || {};
if (!cfg.databaseURL) {
  showSetup('Noch nicht eingerichtet: In config.js fehlt die databaseURL (siehe README).');
  throw new Error('Firebase nicht konfiguriert');
}
const db = getDatabase(initializeApp(cfg));

let loaded = false, total = 0, lastMs = null, serverOffset = 0, sending = false;
const serverNow = () => Date.now() + serverOffset;

const fmtTime = ts => new Date(ts).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
const fmtHour = ts => {
  const a = new Date(ts), b = new Date(ts + HOUR_MS);
  const d = a.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
  const h = x => x.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  return `${d}, ${h(a)}–${h(b)} Uhr`;
};
const cleanName = s => s.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 30) || 'Anonym';
const showMsg = (cls, text) => { msg.className = 'msg ' + cls; msg.textContent = text; };
const isDenied = e => /permission/i.test(String(e && (e.code || e.message)));
const dbError = e => {
  console.error(e);
  if (isDenied(e)) showSetup('Kein Zugriff auf die Datenbank: Bitte die Regeln aus database.rules.json in Firebase veröffentlichen (siehe README).');
  else showMsg('bad', 'Datenbank nicht erreichbar.');
};

// ---------- Live-Daten ----------
onValue(ref(db, '.info/serverTimeOffset'), s => { serverOffset = s.val() || 0; });

onValue(ref(db, 'state'), snap => {
  const d = snap.val();
  total = d?.total ?? 0;
  lastMs = d?.last ?? null;
  $('total').textContent = total.toLocaleString('de-DE');
  loaded = true;
  tick();
}, dbError);

onValue(query(ref(db, 'hours'), orderByValue(), limitToLast(5)), snap => {
  const list = [];
  snap.forEach(c => { list.push({ hourStart: Number(c.key) * HOUR_MS, count: c.val() }); });
  list.reverse();   // größter Wert zuerst
  const rec = $('records');
  rec.replaceChildren();
  if (!list.length) {
    const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Noch keine Klicks'; rec.append(li);
  }
  for (const r of list) {
    const li = document.createElement('li');
    li.textContent = `${r.count.toLocaleString('de-DE')} Klicks – ${fmtHour(r.hourStart)}`;
    rec.append(li);
  }
}, dbError);

let hourUnsub = null, watchedHour = null, thisHourCount = 0;
function watchCurrentHour() {
  const h = Math.floor(serverNow() / HOUR_MS);
  if (h === watchedHour) return;
  watchedHour = h;
  if (hourUnsub) hourUnsub();
  hourUnsub = onValue(ref(db, 'hours/' + h), s => {
    thisHourCount = s.val() ?? 0;
    $('this-hour').textContent = thisHourCount.toLocaleString('de-DE');
  }, dbError);
}
watchCurrentHour();
setInterval(watchCurrentHour, 10000);

onValue(query(ref(db, 'logs'), orderByKey(), limitToLast(50)), snap => {
  const rows = [];
  snap.forEach(c => { rows.push(c.val()); });
  rows.reverse();   // neueste zuerst
  const tb = $('logs');
  tb.replaceChildren();
  if (!rows.length) {
    const tr = document.createElement('tr'); const td = document.createElement('td');
    td.colSpan = 3; td.className = 'empty'; td.textContent = 'Noch keine Einträge'; tr.append(td); tb.append(tr);
  }
  for (const l of rows) {
    const tr = document.createElement('tr');
    const t = document.createElement('td'); t.textContent = typeof l.ts === 'number' ? fmtTime(l.ts) : '…';
    const n = document.createElement('td'); n.textContent = l.name;   // textContent = kein XSS
    const st = document.createElement('td');
    st.textContent = l.accepted ? '✅ gezählt' : '⛔ abgelehnt (Sperre)';
    st.className = l.accepted ? 's-ok' : 's-bad';
    tr.append(t, n, st); tb.append(tr);
  }
}, dbError);

// ---------- Knopf ----------
function remainingMs() {
  return lastMs == null ? 0 : Math.max(0, lastMs + COOLDOWN_MS - serverNow());
}
function tick() {
  if (!loaded) return;
  const rem = remainingMs();
  btn.disabled = sending || rem > 0;
  btn.textContent = rem > 0 ? (rem / 1000).toFixed(1) + ' s' : '+1';
}
setInterval(tick, 100);

btn.addEventListener('click', async () => {
  const name = cleanName(nameInput.value);
  sending = true; tick();
  try {
    // Zähler, Stunde und Log in EINEM atomaren Schreibvorgang. Die Regeln lehnen ihn ab,
    // wenn seit dem letzten Klick weniger als 5 s (Serverzeit) vergangen sind oder
    // jemand anderes gerade schneller war (dann stimmt "total + 1" nicht mehr).
    const h = Math.floor(serverNow() / HOUR_MS);
    const logKey = push(ref(db, 'logs')).key;
    await update(ref(db), {
      state: { total: total + 1, last: serverTimestamp() },
      ['hours/' + h]: (h === watchedHour ? thisHourCount : 0) + 1,
      ['logs/' + logKey]: { ts: serverTimestamp(), name, accepted: true },
    });
    showMsg('ok', 'Gezählt! +1');
  } catch (e) {
    if (isDenied(e)) {
      showMsg('bad', 'Zu spät – jemand war schneller. Der Knopf ist noch kurz gesperrt.');
      push(ref(db, 'logs'), { ts: serverTimestamp(), name, accepted: false }).catch(console.error);
    } else {
      console.error(e);
      showMsg('bad', 'Verbindung fehlgeschlagen.');
    }
  } finally {
    sending = false; tick();
  }
});
</script>
</body>
</html>
