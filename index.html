<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b14;
    --card: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.08);
    --text: #eef0f7;
    --muted: #8d93a8;
    --a1: #7c5cff;
    --a2: #3fa9ff;
    --ok: #34d399;
    --bad: #fb7185;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 400px at 15% -5%, rgba(124,92,255,.28), transparent 70%),
      radial-gradient(500px 380px at 95% 10%, rgba(63,169,255,.20), transparent 70%),
      radial-gradient(700px 500px at 50% 110%, rgba(124,92,255,.14), transparent 70%);
  }
  main { max-width: 820px; margin: 0 auto; padding: 40px 18px 72px; }

  /* ---------- Kopf ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--a1), var(--a2)); font-weight: 900; font-size: 20px;
    box-shadow: 0 8px 24px rgba(124,92,255,.35);
  }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .tagline { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); font-size: 13px; color: var(--muted); font-weight: 500;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: ping 1.8s infinite; }
  .live { color: var(--ok); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 100% { box-shadow: 0 0 0 9px rgba(52,211,153,0); } }

  /* ---------- Karten ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 22px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .card + .card, .grid + .card, .card + .grid { margin-top: 16px; }
  h2 { margin: 0 0 14px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }

  .setup { border-color: rgba(251,191,36,.45); background: rgba(251,191,36,.08); color: #fde68a; margin-bottom: 16px; font-size: 14px; }

  /* ---------- Hauptbereich ---------- */
  .hero { text-align: center; padding: 34px 22px 28px; }
  .total {
    font-size: clamp(64px, 14vw, 104px); font-weight: 900; line-height: 1; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff 30%, #b9b3ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    display: inline-block; transition: transform .25s cubic-bezier(.2,1.6,.4,1);
  }
  .total.bump { transform: scale(1.08); }
  .total-label { color: var(--muted); font-weight: 500; margin: 6px 0 22px; }

  .last-click {
    display: flex; width: fit-content; align-items: center; gap: 10px; max-width: 100%;
    margin: 0 auto 26px; padding: 6px 16px 6px 6px; border-radius: 999px;
    background: rgba(0,0,0,.25); border: 1px solid var(--border); font-size: 14px; color: var(--muted);
  }
  .last-click[hidden] { display: none; }
  .last-click.new { animation: lcPop .6s ease-out; }
  @keyframes lcPop { 0% { border-color: rgba(52,211,153,.9); box-shadow: 0 0 0 6px rgba(52,211,153,.18); } 100% { border-color: var(--border); box-shadow: none; } }
  .lc-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--a1), var(--a2)); color: #fff; font-weight: 800; font-size: 13px;
  }
  .lc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-text b { color: var(--text); font-weight: 700; }
  .lc-when::before { content: ' · '; }

  .stage { position: relative; display: block; width: fit-content; margin: 0 auto; }
  .ring {
    --p: 1;
    width: 248px; height: 248px; border-radius: 50%; padding: 10px; margin: 0 auto;
    background: conic-gradient(var(--a2), var(--a1) calc(var(--p) * 1turn), rgba(255,255,255,.07) 0);
    transition: filter .3s;
  }
  .ring.ready { filter: drop-shadow(0 0 22px rgba(124,92,255,.55)); }
  .ring.spam { background: conic-gradient(var(--bad) calc(var(--p) * 1turn), rgba(251,113,133,.12) 0); }
  button#click {
    width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--bg); cursor: pointer;
    font: 800 44px Inter, system-ui, sans-serif; color: #fff; letter-spacing: -.02em;
    background: radial-gradient(circle at 30% 25%, #9d86ff, var(--a1) 45%, #4b3bd1);
    box-shadow: inset 0 -10px 24px rgba(0,0,0,.28), inset 0 8px 20px rgba(255,255,255,.18);
    transition: transform .08s, background .3s, color .3s;
    -webkit-tap-highlight-color: transparent;
  }
  button#click:hover:not(:disabled) { transform: scale(1.03); }
  button#click:active:not(:disabled) { transform: scale(.95); }
  button#click:disabled {
    cursor: not-allowed; color: #c7cbe0; font-size: 34px;
    background: radial-gradient(circle at 30% 25%, #2c3047, #1a1d2c 60%);
  }
  button#click .sub { display: block; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-top: 2px; }
  .float {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, 0); pointer-events: none;
    font-weight: 900; font-size: 34px; color: var(--ok); text-shadow: 0 4px 18px rgba(52,211,153,.5);
    animation: floatUp .9s ease-out forwards;
  }
  @keyframes floatUp { to { transform: translate(-50%, -110px); opacity: 0; } }

  .msg { min-height: 22px; margin-top: 22px; font-weight: 600; font-size: 15px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }

  .name {
    margin: 18px auto 0; display: flex; align-items: center; gap: 10px; max-width: 320px;
    background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 999px; padding: 6px 6px 6px 16px;
  }
  .name span { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .name input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text);
    font: 600 15px Inter, system-ui, sans-serif; padding: 8px 10px; border-radius: 999px;
  }
  .name:focus-within { border-color: rgba(124,92,255,.6); box-shadow: 0 0 0 4px rgba(124,92,255,.15); }

  /* ---------- Statistik ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; margin-top: 16px; }
  .big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 16px; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--a1), var(--a2)); transition: width .4s; }

  ol.records { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ol.records li {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px;
    background: rgba(255,255,255,.03); border: 1px solid transparent; font-variant-numeric: tabular-nums;
  }
  ol.records li.first { border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.07); }
  .medal { width: 28px; text-align: center; font-size: 20px; flex: none; }
  .rank { color: var(--muted); font-weight: 700; font-size: 14px; }
  .rec-count { font-weight: 800; font-size: 17px; }
  .rec-when { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }

  /* ---------- Log ---------- */
  .log-head { display: flex; justify-content: space-between; align-items: baseline; }
  .table-wrap { max-height: 440px; overflow: auto; margin: 0 -8px; padding: 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th {
    position: sticky; top: 0; background: #12131f; text-align: left; padding: 10px; z-index: 1;
    color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  }
  td { padding: 11px 10px; border-top: 1px solid var(--border); }
  td.time { color: var(--muted); white-space: nowrap; }
  td.who { font-weight: 600; word-break: break-word; }
  tr.new td { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(124,92,255,.18); } to { background: transparent; } }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.ok { color: var(--ok); background: rgba(52,211,153,.12); }
  .chip.bad { color: var(--bad); background: rgba(251,113,133,.12); }
  .chip.off { color: var(--muted); background: rgba(255,255,255,.06); }
  td.status { white-space: nowrap; }
  tr.removed td.time, tr.removed td.who { text-decoration: line-through; opacity: .5; }
  button.undo {
    margin-left: 8px; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; vertical-align: middle;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 14px;
    opacity: .45; transition: opacity .15s, color .15s, border-color .15s;
  }
  tr:hover button.undo, button.undo:focus-visible { opacity: 1; }
  button.undo:hover { color: var(--bad); border-color: rgba(251,113,133,.5); }
  @media (hover: none) { button.undo { opacity: .8; } }

  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 14px; }
  ol.records li.empty { display: block; background: transparent; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; opacity: .7; }

  /* ---------- Spracherkennung ---------- */
  .card.voice { margin-top: 16px; text-align: center; }
  .voice h2 { margin-bottom: 14px; }
  .voice-status { font-size: 14px; color: var(--muted); margin-top: 12px; }
  .voice-meter { width: min(100%, 320px); height: 6px; margin: 12px auto 0; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .voice-meter > i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--ok), var(--gold), var(--bad)); transition: width .08s; }
  .voice-mode { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .voice-mode select {
    background: rgba(0,0,0,.3); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 10px; font: 500 13px Inter, system-ui, sans-serif; max-width: 70vw;
  }
  .voice-status.listening { color: var(--ok); }
  .voice-status.listening::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 8px; animation: ping 1.2s infinite; vertical-align: middle; }
  .voice-status.error { color: var(--bad); }
  .voice-btn {
    border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text);
    font: 700 14px Inter, system-ui, sans-serif; padding: 12px 18px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .voice-btn:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  .voice-btn.on { background: rgba(251,113,133,.15); border-color: rgba(251,113,133,.5); color: #fecdd3; }
  .voice-btn:disabled { opacity: .5; cursor: not-allowed; }
  .voice-heard { color: var(--muted); font-size: 13px; margin-top: 10px; font-style: italic; min-height: 1em; }

  /* ---------- Spruch-Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 18px; z-index: 50; width: min(92vw, 460px);
    transform: translate(-50%, -140%); opacity: 0; pointer-events: none;
    padding: 16px 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(63,169,255,.95));
    box-shadow: 0 18px 50px rgba(0,0,0,.45); transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast-nr { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .toast-text { font-size: 18px; font-weight: 800; margin-top: 4px; }

  /* ---------- Seltenes Bild ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
    background: rgba(5,6,12,.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer;
  }
  .overlay[hidden] { display: none; }
  .overlay-box { text-align: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }
  .overlay-badge { display: inline-block; padding: 8px 16px; border-radius: 999px; background: var(--gold); color: #1a1300; font-weight: 800; margin-bottom: 14px; }
  .overlay img { display: block; max-width: min(88vw, 520px); max-height: 65vh; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); margin: 0 auto; }
  .overlay-hint { color: var(--muted); font-size: 13px; margin-top: 12px; }

  @media (max-width: 640px) {
    main { padding-top: 24px; }
    .grid { grid-template-columns: 1fr; }
    .ring { width: 216px; height: 216px; }
    .rec-when { font-size: 12px; }
    td.time .date { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ================= Kompaktes Layout: alles auf einen Bildschirm ================= */
  html, body { height: 100%; }
  main.app {
    max-width: 1440px; height: 100vh; height: 100dvh; padding: 14px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  main.app header { margin: 0; }
  main.app .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 15px; }
  main.app h1 { font-size: 20px; }
  main.app .pill { padding: 5px 10px; font-size: 12px; }
  main.app .setup { margin: 0; }

  .layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1.05fr 1fr 1.15fr; gap: 12px;
  }
  .layout > * { min-height: 0; }
  .layout .card { margin: 0; padding: 14px 16px; border-radius: 18px; }
  .layout h2 { margin-bottom: 8px; }

  /* Links: Knopf */
  .layout .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .layout .total { font-size: clamp(44px, 8vh, 84px); }
  .layout .total-label { margin: 2px 0 12px; font-size: 14px; }
  .layout .last-click { margin: 0 auto 14px; font-size: 13px; padding: 4px 12px 4px 4px; }
  .layout .lc-avatar { width: 26px; height: 26px; font-size: 12px; }
  .layout .ring { width: clamp(150px, 32vh, 240px); height: clamp(150px, 32vh, 240px); padding: 8px; }
  .layout button#click { font-size: clamp(28px, 5vh, 40px); border-width: 5px; }
  .layout button#click:disabled { font-size: clamp(22px, 4vh, 30px); }
  .layout .msg { margin-top: 12px; min-height: 20px; font-size: 14px; }
  .layout .name { margin-top: 8px; padding: 4px 4px 4px 14px; }
  .layout .name input { padding: 6px 8px; font-size: 14px; }

  /* Mitte: Block, Rekorde, Sprache */
  .mid { display: flex; flex-direction: column; gap: 12px; }
  .mid .big { font-size: 34px; }
  .mid .bar { margin-top: 10px; height: 6px; }
  .mid .hint { margin-top: 6px; font-size: 12px; }
  .records-card { flex: 1; min-height: 0; overflow: auto; }
  .records-card ol.records { gap: 5px; }
  .records-card ol.records li { padding: 6px 10px; border-radius: 10px; }
  .records-card .medal { font-size: 17px; width: 24px; }
  .records-card .rec-count { font-size: 15px; }
  .records-card .rec-when { font-size: 12px; }

  .layout .voice { text-align: left; }
  .voice-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .voice-top h2 { margin: 0; }
  .layout .voice-btn { padding: 7px 12px; font-size: 12px; }
  .layout .voice-status { margin-top: 8px; font-size: 12px; }
  .layout .voice-meter { width: 100%; margin: 8px 0 0; height: 5px; }
  .layout .voice-mode { margin-top: 8px; font-size: 12px; }
  .layout .voice-mode select { padding: 5px 8px; font-size: 12px; }
  .layout .voice-heard { margin-top: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Rechts: Log (scrollt nur in sich selbst) */
  .log-card { display: flex; flex-direction: column; }
  .log-card .table-wrap { flex: 1; min-height: 0; max-height: none; }
  .log-card table { font-size: 13px; }
  .log-card th { padding: 7px 8px; background: #141522; }
  .log-card td { padding: 6px 8px; }
  .log-card td.time .date { display: none; }
  .log-card button.undo { width: 24px; height: 24px; font-size: 12px; margin-left: 6px; }

  /* Tablet: 2 Spalten, Log unten */
  @media (max-width: 1050px) {
    .layout { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, .8fr); }
    .log-card { grid-column: 1 / -1; }
  }
  /* Handy: untereinander, so knapp wie möglich (hier lässt sich Scrollen nicht ganz vermeiden) */
  @media (max-width: 680px) {
    main.app { height: auto; padding: 10px; }
    .layout { grid-template-columns: 1fr; grid-template-rows: none; }
    .records-card { max-height: 220px; }
    .log-card { height: 320px; }
    .layout .ring { width: 190px; height: 190px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo">+1</div>
      <h1>Klicker</h1>
    </div>
    <div class="pills">
      <span class="pill">🔒 5 s Sperre für alle</span>
      <span class="pill" id="conn"><span class="dot"></span><span id="conn-text">Verbinde…</span></span>
    </div>
  </header>

  <section class="card setup" id="setup" hidden></section>

  <div class="layout">
    <section class="card hero">
      <div class="total" id="total">–</div>
      <div class="total-label">Klicks insgesamt</div>

      <div class="last-click" id="last-click" hidden>
        <span class="lc-avatar" id="lc-avatar"></span>
        <span class="lc-text">Letzter Klick von <b id="lc-name"></b><span class="lc-when" id="lc-when"></span></span>
      </div>

      <div class="stage" id="stage">
        <div class="ring" id="ring">
          <button id="click" disabled>+1</button>
        </div>
      </div>

      <div class="msg" id="msg"></div>
      <label class="name"><span>Dein Name</span><input id="name" maxlength="30" placeholder="Anonym" autocomplete="nickname"></label>
    </section>

    <div class="mid">
      <section class="card">
        <h2 id="block-title">Aktueller Block</h2>
        <div class="big" id="this-hour">–</div>
        <div class="bar"><i id="hour-bar"></i></div>
        <div class="hint" id="hour-hint"></div>
      </section>

      <section class="card records-card">
        <h2>🏆 Rekorde pro Block</h2>
        <ol class="records" id="records"><li class="empty">Noch keine Klicks</li></ol>
      </section>

      <section class="card voice">
        <div class="voice-top">
          <h2>🎤 Automatisch zählen</h2>
          <button class="voice-btn" id="voice-btn">🎤 Spracherkennung an</button>
        </div>
        <div class="voice-status off" id="voice-status"></div>
        <div class="voice-meter" title="Mikrofon-Pegel"><i id="voice-meter-bar"></i></div>
        <label class="voice-mode">Erkennung:
          <select id="voice-mode">
            <option value="streng">Streng – nur exakt</option>
            <option value="normal">Normal – kleine Hörfehler</option>
            <option value="locker">Locker – große Entfernung</option>
          </select>
        </label>
        <div class="voice-heard" id="voice-heard"></div>
      </section>
    </div>

    <section class="card log-card">
      <div class="log-head"><h2>Log</h2><h2>Letzte 50</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Zeit</th><th>Name</th><th>Status</th></tr></thead>
          <tbody id="logs"><tr><td colspan="3" class="empty">Noch keine Einträge</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-nr" id="toast-nr"></div>
  <div class="toast-text" id="toast-text"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-box">
    <div class="overlay-badge">🍀 Seltenes Bild! (1 zu 100)</div>
    <img id="overlay-img" alt="Lustiges Bild">
    <div class="overlay-hint">Tippen zum Schließen</div>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getDatabase, ref, onValue, query, orderByKey, orderByValue, limitToLast,
  update, push, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

const COOLDOWN_MS = 5000;
const $ = id => document.getElementById(id);
const btn = $('click'), msg = $('msg'), nameInput = $('name'), ring = $('ring');

nameInput.value = localStorage.getItem('klicker-name') || '';
nameInput.addEventListener('input', () => localStorage.setItem('klicker-name', nameInput.value));

function showSetup(text) { const s = $('setup'); s.textContent = text; s.hidden = false; }

const cfg = window.FIREBASE_CONFIG || {};
if (!cfg.databaseURL) {
  showSetup('Noch nicht eingerichtet: In config.js fehlt die databaseURL (siehe README).');
  throw new Error('Firebase nicht konfiguriert');
}
const db = getDatabase(initializeApp(cfg));

let loaded = false, total = null, lastMs = null, serverOffset = 0, sending = false;
const serverNow = () => Date.now() + serverOffset;
const de = n => Number(n).toLocaleString('de-DE');

const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
const fmtClock = ts => new Date(ts).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
const cleanName = s => s.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 30) || 'Anonym';
const showMsg = (cls, text) => { msg.className = 'msg ' + cls; msg.textContent = text; };
const isDenied = e => /permission/i.test(String(e && (e.code || e.message)));
const dbError = e => {
  console.error(e);
  if (isDenied(e)) showSetup('Kein Zugriff auf die Datenbank: Bitte die Regeln aus database.rules.json in Firebase veröffentlichen (siehe README).');
  else showMsg('bad', 'Datenbank nicht erreichbar.');
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- Verbindung ----------
onValue(ref(db, '.info/connected'), s => {
  const on = s.val() === true;
  $('conn').classList.toggle('live', on);
  $('conn-text').textContent = on ? 'Live' : 'Offline';
});
onValue(ref(db, '.info/serverTimeOffset'), s => { serverOffset = s.val() || 0; });

// ---------- Gesamtzähler ----------
onValue(ref(db, 'state'), snap => {
  const d = snap.val();
  const newTotal = d?.total ?? 0;
  if (total !== null && newTotal > total) {
    const t = $('total'); t.classList.add('bump'); setTimeout(() => t.classList.remove('bump'), 220);
  }
  if (total !== null && newTotal > total && newTotal % 3 === 0) showSpruch(newTotal);
  total = newTotal;
  lastMs = d?.last ?? null;
  $('total').textContent = de(total);
  loaded = true;
  tick();
}, dbError);

// ---------- Zeitblöcke (aus config.js) ----------
const TZ = cfg.TIMEZONE || 'Europe/Berlin';
const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const BLOCKS = (cfg.BLOCKS && cfg.BLOCKS.length ? cfg.BLOCKS : [{ start: '09:45', end: '11:15' }, { start: '11:30', end: '13:00' }])
  .map(b => ({ label: `${b.start}–${b.end}`, s: toMin(b.start), e: toMin(b.end) }))
  .sort((a, b) => a.s - b.s);
const partsFmt = new Intl.DateTimeFormat('de-DE', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
});
function localParts(ts) {
  const p = {};
  for (const x of partsFmt.formatToParts(ts)) p[x.type] = x.value;
  return { date: `${p.day}.${p.month}.${p.year}`, dateKey: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
}
function blockAt(ts) {
  const p = localParts(ts);
  const i = BLOCKS.findIndex(b => p.min >= b.s && p.min < b.e);
  return i < 0 ? null : { key: `${p.dateKey}#${i}`, date: p.date, block: BLOCKS[i] };
}

// Rekorde werden aus allen gezählten Klicks im Log berechnet.
let blockCounts = new Map();
function computeBlocks(rows) {
  blockCounts = new Map();
  for (const r of rows) {
    if (!r.accepted || r.removed || typeof r.ts !== 'number') continue;
    const b = blockAt(r.ts);
    if (!b) continue;
    const e = blockCounts.get(b.key) || { ...b, count: 0 };
    e.count++;
    blockCounts.set(b.key, e);
  }
  renderRecords();
  renderBlock();
}

function renderRecords() {
  const list = [...blockCounts.values()]
    .sort((a, b) => b.count - a.count || (a.key < b.key ? 1 : -1))
    .slice(0, 5);
  const rec = $('records');
  rec.replaceChildren();
  if (!list.length) rec.append(el('li', 'empty', 'Noch keine Klicks in einem Block'));
  const medals = ['🥇', '🥈', '🥉'];
  list.forEach((r, i) => {
    const li = el('li', i === 0 ? 'first' : '');
    li.append(
      medals[i] ? el('span', 'medal', medals[i]) : el('span', 'medal rank', `${i + 1}.`),
      el('span', 'rec-count', de(r.count)),
      el('span', 'rec-when', `${r.date} · ${r.block.label} Uhr`),
    );
    rec.append(li);
  });
}

function renderBlock() {
  const now = serverNow();
  const cur = blockAt(now);
  const best = Math.max(0, ...[...blockCounts.values()].map(e => e.count));
  if (!cur) {
    const min = localParts(now).min;
    const next = BLOCKS.find(b => b.s > min) || BLOCKS[0];
    $('block-title').textContent = 'Aktueller Block';
    $('this-hour').textContent = 'Pause';
    $('hour-bar').style.width = '0%';
    $('hour-hint').textContent = `Gerade läuft kein Block. Nächster: ${next.label} Uhr`;
    return;
  }
  const count = blockCounts.get(cur.key)?.count ?? 0;
  const max = Math.floor((cur.block.e - cur.block.s) * 60000 / COOLDOWN_MS);
  $('block-title').textContent = `Aktueller Block · ${cur.block.label} Uhr`;
  $('this-hour').textContent = de(count);
  $('hour-bar').style.width = Math.min(100, count / max * 100) + '%';
  $('hour-hint').textContent = count > 0 && count >= best
    ? '🔥 Neuer Rekord läuft gerade!'
    : best ? `Noch ${de(best - count + 1)} bis zum Rekord (${de(best)})`
    : `Maximal ${de(max)} Klicks in diesem Block möglich`;
}
setInterval(renderBlock, 10000);

// ---------- Log ----------
let seenLogs = null;
onValue(query(ref(db, 'logs'), orderByKey()), snap => {
  const rows = [];
  snap.forEach(c => { rows.push({ key: c.key, ...c.val() }); });
  rows.reverse();   // neueste zuerst
  computeBlocks(rows);
  const tb = $('logs');
  tb.replaceChildren();
  if (!rows.length) {
    const tr = el('tr'); const td = el('td', 'empty', 'Noch keine Einträge'); td.colSpan = 3; tr.append(td); tb.append(tr);
  }
  for (const l of rows.slice(0, 50)) {
    const tr = el('tr', seenLogs && !seenLogs.has(l.key) ? 'new' : '');
    const t = el('td', 'time');
    if (typeof l.ts === 'number') t.append(el('span', 'date', fmtDate(l.ts) + ' · '), fmtClock(l.ts));
    else t.textContent = '…';
    const st = el('td', 'status');
    if (l.removed) {
      tr.classList.add('removed');
      st.append(el('span', 'chip off', '↩ entfernt'));
    } else {
      st.append(el('span', 'chip ' + (l.accepted ? 'ok' : 'bad'), l.accepted ? '✓ gezählt' : '✕ abgelehnt'));
      if (l.accepted) {
        const u = el('button', 'undo', '↩');
        u.title = 'Diesen Klick entfernen';
        u.addEventListener('click', () => undoClick(l));
        st.append(u);
      }
    }
    tr.append(t, el('td', 'who', l.name), st);   // textContent = kein XSS
    tb.append(tr);
  }
  seenLogs = new Set(rows.map(r => r.key));

  const lastOk = rows.find(r => r.accepted && !r.removed);
  if (!lastOk) { $('last-click').hidden = true; lastClickTs = null; }
  if (lastOk) {
    const box = $('last-click');
    if (lastClickKey && lastClickKey !== lastOk.key) {
      box.classList.remove('new'); void box.offsetWidth; box.classList.add('new');
    }
    lastClickKey = lastOk.key;
    lastClickTs = typeof lastOk.ts === 'number' ? lastOk.ts : serverNow();
    $('lc-name').textContent = lastOk.name;
    $('lc-avatar').textContent = [...lastOk.name][0].toUpperCase();
    box.hidden = false;
    renderLastWhen();
  }
}, dbError);

// ---------- Letzter Klick ----------
let lastClickKey = null, lastClickTs = null;
function renderLastWhen() {
  if (lastClickTs == null) return;
  const s = Math.max(0, Math.floor((serverNow() - lastClickTs) / 1000));
  let txt;
  if (s < 5) txt = 'gerade eben';
  else if (s < 60) txt = `vor ${s} s`;
  else if (s < 3600) txt = `vor ${Math.floor(s / 60)} min`;
  else if (s < 86400) txt = `vor ${Math.floor(s / 3600)} h`;
  else txt = `am ${fmtDate(lastClickTs)}`;
  $('lc-when').textContent = `${txt} (${fmtClock(lastClickTs)} Uhr)`;
}
setInterval(renderLastWhen, 1000);

// ---------- Knopf ----------
function remainingMs() {
  return lastMs == null ? 0 : Math.max(0, lastMs + COOLDOWN_MS - serverNow());
}
// ---------- Spam-Sperre (pro Gerät) ----------
// Wer zu oft hintereinander per Knopf zählt, wird auf diesem Gerät kurz gesperrt.
// Spracherkennung ist ausgenommen.
const SPAM_CLICKS = cfg.SPAM_CLICKS ?? 3;
const SPAM_WINDOW_MS = (cfg.SPAM_WINDOW_SECONDS ?? 15) * 1000;
const SPAM_LOCK_MS = (cfg.SPAM_LOCK_SECONDS ?? 60) * 1000;
let ownClicks = JSON.parse(localStorage.getItem('klicker-own-clicks') || '[]');
let spamUntil = Number(localStorage.getItem('klicker-spam-until')) || 0;
function spamRemainingMs() { return Math.max(0, spamUntil - Date.now()); }
function registerOwnClick() {   // true = jetzt gesperrt
  const now = Date.now();
  ownClicks = ownClicks.filter(t => now - t < SPAM_WINDOW_MS);
  ownClicks.push(now);
  let locked = false;
  if (ownClicks.length >= SPAM_CLICKS) {
    spamUntil = now + SPAM_LOCK_MS;
    ownClicks = [];
    locked = true;
  }
  localStorage.setItem('klicker-own-clicks', JSON.stringify(ownClicks));
  localStorage.setItem('klicker-spam-until', String(spamUntil));
  return locked;
}

let lastLabel = '';
function tick() {
  if (!loaded) return;
  const spam = spamRemainingMs();
  const rem = remainingMs();
  btn.disabled = sending || rem > 0 || spam > 0;
  ring.classList.toggle('spam', spam > 0);
  if (spam > 0) {
    ring.style.setProperty('--p', (1 - spam / SPAM_LOCK_MS).toFixed(3));
    ring.classList.remove('ready');
    const label = 'spam|' + Math.ceil(spam / 1000);
    if (label !== lastLabel) {
      lastLabel = label;
      btn.replaceChildren(`🚫 ${Math.ceil(spam / 1000)} s`, el('span', 'sub', 'zu oft geklickt'));
    }
    return;
  }
  ring.style.setProperty('--p', (1 - rem / COOLDOWN_MS).toFixed(3));
  ring.classList.toggle('ready', rem === 0 && !sending);
  const label = rem > 0 ? (rem / 1000).toFixed(1) + '|gesperrt' : '+1';
  if (label !== lastLabel) {
    lastLabel = label;
    if (rem > 0) { btn.replaceChildren((rem / 1000).toFixed(1) + ' s', el('span', 'sub', 'gesperrt')); }
    else btn.textContent = '+1';
  }
}
setInterval(tick, 50);

function floatPlusOne() {
  const f = el('div', 'float', '+1');
  $('stage').append(f);
  setTimeout(() => f.remove(), 950);
}

// ---------- Sprüche (alle 3 Klicks) ----------
const SPRUECHE = [
  'An der Stelle: Respekt. 👏',
  'Statistisch gesehen ist das hier die Stelle.',
  'Wieder eine Stelle gefunden. Die Archäologen sind neidisch.',
  'Breaking News: Es gibt noch Stellen, an denen nichts gesagt wurde.',
  'An der Stelle wäre eine Pause auch mal schön.',
  'Wenn jede Stelle einen Euro bringen würde … 💸',
  'Diese Stelle wurde soeben offiziell markiert. 📍',
  'Achtung, Stellen-Alarm! 🚨',
  'An der Stelle möchte ich mich bei allen Stellen bedanken.',
  'Neue Stelle entdeckt. Google Maps wird aktualisiert.',
  'Wieder drei Stellen weiter. Wir kommen voran!',
  'An der Stelle sei gesagt: Das war eine Stelle.',
  'Stellen-Zähler läuft heiß 🔥',
  'Die Stelle ist jetzt besetzt. Bewerbungen bitte an anderer Stelle.',
  'Das ist nicht irgendeine Stelle. Das ist DIE Stelle.',
  'Fun Fact: Keiner weiß, wo die Stelle eigentlich ist.',
  'Hier könnte Ihre Stelle stehen.',
  'Stelle um Stelle zum Weltrekord! 🏆',
  'Wir unterbrechen kurz für eine weitere Stelle.',
  'An der Stelle: kurz durchatmen. Und weiterklicken.',
];
let lastSpruch = -1, toastTimer = null;
function showSpruch(nr) {
  let i;
  do { i = Math.floor(Math.random() * SPRUECHE.length); } while (SPRUECHE.length > 1 && i === lastSpruch);
  lastSpruch = i;
  const t = $('toast');
  $('toast-nr').textContent = `Klick Nr. ${de(nr)}`;
  $('toast-text').textContent = SPRUECHE[i];
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
}

// ---------- Seltenes Bild (1 zu 100) ----------
const FUNNY_IMAGE = cfg.FUNNY_IMAGE || 'lustig.svg';
const FUNNY_CHANCE = cfg.FUNNY_CHANCE ?? 0.01;
let overlayTimer = null;
function showFunnyImage() {
  const o = $('overlay');
  $('overlay-img').src = FUNNY_IMAGE;
  o.hidden = false;
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(() => { o.hidden = true; }, 6000);
}
$('overlay').addEventListener('click', () => { $('overlay').hidden = true; });

// ---------- Klicken ----------
async function doClick(source) {
  if (sending || !loaded || remainingMs() > 0) return false;
  if (source === 'button' && spamRemainingMs() > 0) return false;
  let name = cleanName(nameInput.value);
  if (source === 'voice') name = name.slice(0, 27) + ' 🎤';
  sending = true; tick();
  try {
    const logKey = push(ref(db, 'logs')).key;
    await update(ref(db), {
      state: { total: (total ?? 0) + 1, last: serverTimestamp() },
      ['logs/' + logKey]: { ts: serverTimestamp(), name, accepted: true },
    });
    floatPlusOne();
    if (source === 'button' && registerOwnClick()) {
      showMsg('bad', `🚫 ${SPAM_CLICKS} Klicks in ${SPAM_WINDOW_MS / 1000} s – du bist ${SPAM_LOCK_MS / 1000} s gesperrt.`);
      return true;
    }
    showMsg('ok', source === 'voice' ? '🎤 „An der Stelle“ erkannt – gezählt!' : 'Gezählt! Danke fürs Klicken 🎉');
    if (Math.random() < FUNNY_CHANCE) showFunnyImage();
    return true;
  } catch (e) {
    if (isDenied(e) && source === 'voice') {
      // Ein anderes Gerät hat denselben Satz zuerst erkannt → nicht doppelt zählen, nichts loggen.
      setVoiceUi('listening', 'Schon von einem anderen Gerät gezählt – nicht doppelt.');
    } else if (isDenied(e)) {
      showMsg('bad', 'Zu spät – jemand war schneller.');
      push(ref(db, 'logs'), { ts: serverTimestamp(), name, accepted: false }).catch(console.error);
    } else {
      console.error(e);
      showMsg('bad', 'Verbindung fehlgeschlagen.');
    }
    return false;
  } finally {
    sending = false; tick();
  }
}
btn.addEventListener('click', () => doClick('button'));

// ---------- Rückgängig ----------
async function undoClick(l) {
  if (typeof l.ts !== 'number') return;
  if (!confirm(`Klick von „${l.name}“ um ${fmtClock(l.ts)} Uhr entfernen?\nDer Zähler geht dann um 1 runter.`)) return;
  try {
    // Zähler −1 und Log-Eintrag als "entfernt" markieren – in EINEM Schreibvorgang.
    await update(ref(db), {
      state: { total: total - 1, last: lastMs, lastUndo: l.key },
      ['logs/' + l.key]: { ts: l.ts, name: l.name, accepted: true, removed: true, removedAt: serverTimestamp() },
    });
    showMsg('ok', `↩ Klick von ${l.name} entfernt.`);
  } catch (e) {
    console.error(e);
    showMsg('bad', isDenied(e)
      ? 'Entfernen nicht möglich (gerade wurde geklickt oder die Regeln sind noch alt). Nochmal versuchen.'
      : 'Verbindung fehlgeschlagen.');
  }
}

// ---------- Spracherkennung „an der Stelle“ ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Zeitfenster, in dem ein erkannter Satz als "derselbe" gilt wie der zuletzt gezählte Klick.
const VOICE_WINDOW_MS = (cfg.VOICE_DEDUPE_SECONDS ?? 8) * 1000;
const voiceBtn = $('voice-btn'), voiceStatus = $('voice-status'), voiceHeard = $('voice-heard');
const modeSel = $('voice-mode'), meterBar = $('voice-meter-bar');
let rec = null, voiceOn = false, counted = [];
let usePhrases = localStorage.getItem('klicker-no-phrases') !== '1';

// Erkennung: Groß/klein, Satzzeichen und typische Hörfehler bei leiser/entfernter Stimme
// werden toleriert ("ander Stelle", "an de Stelle", "an den Stellen", "and der Stelle" …).
// Es werden ALLE Alternativen geprüft, die der Browser liefert, nicht nur die beste.
const TARGET = 'an der stelle';
const MODES = {
  streng: { max: 0, stelle: 0 },  // nur exakt "an der Stelle"
  normal: { max: 1, stelle: 1 },  // kleine Hörfehler
  locker: { max: 3, stelle: 2 },  // für große Entfernung, zählt evtl. auch ähnliche Sätze
};
modeSel.value = localStorage.getItem('klicker-voice-mode') || 'normal';
modeSel.addEventListener('change', () => localStorage.setItem('klicker-voice-mode', modeSel.value));

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-zß]+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function countPhrase(text) {
  const mode = MODES[modeSel.value] || MODES.normal;
  const w = norm(text).split(' ').filter(Boolean);
  let hits = 0;
  for (let i = 0; i < w.length; i++) {
    for (const len of [3, 2, 1, 4]) {          // "an der stelle", "ander stelle", "anderstelle", "an der der stelle"
      if (i + len > w.length) continue;
      const last = w[i + len - 1];
      if (lev(last.slice(-7).replace(/n$/, '').slice(-6), 'stelle') > mode.stelle) continue;
      const cand = w.slice(i, i + len).join(' ');
      const d = Math.min(lev(cand, TARGET), lev(cand.replace(/ /g, ''), TARGET.replace(/ /g, '')));
      if (d <= mode.max) { hits++; i += len - 1; break; }
    }
  }
  return hits;
}

function setVoiceUi(state, text) {
  voiceBtn.classList.toggle('on', voiceOn);
  voiceBtn.textContent = voiceOn ? '⏹ Spracherkennung aus' : '🎤 Spracherkennung an';
  voiceStatus.className = 'voice-status ' + state;
  voiceStatus.textContent = text;
}

// Pegelanzeige: zeigt, ob das Mikrofon die Stimme überhaupt hört (wichtig bei großer Entfernung).
let meterStream = null, meterCtx = null, meterRaf = null;
async function startMeter() {
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
    });
    meterCtx = new AudioContext();
    const an = meterCtx.createAnalyser();
    an.fftSize = 1024;
    meterCtx.createMediaStreamSource(meterStream).connect(an);
    const buf = new Float32Array(an.fftSize);
    const loop = () => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-8);   // ca. -80 … 0
      meterBar.style.width = Math.max(0, Math.min(100, (db + 70) / 55 * 100)) + '%';
      meterRaf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { console.warn('Pegelanzeige nicht verfügbar', e); }
}
function stopMeter() {
  cancelAnimationFrame(meterRaf);
  meterStream && meterStream.getTracks().forEach(t => t.stop());
  meterCtx && meterCtx.close();
  meterStream = meterCtx = null;
  meterBar.style.width = '0%';
}

if (!SR) {
  voiceBtn.disabled = true;
  setVoiceUi('off', 'Dein Browser kann keine Spracherkennung. Bitte Chrome oder Edge benutzen.');
} else {
  setVoiceUi('off', 'Aus. Wenn an, wird jedes „an der Stelle“ automatisch gezählt.');
  voiceBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    if (voiceOn) { startVoice(); startMeter(); }
    else { rec && rec.stop(); stopMeter(); setVoiceUi('off', 'Aus.'); }
  });
}

function onPhrase(text) {
  voiceHeard.textContent = `Erkannt in: „${text.trim()}“`;
  // Wurde gerade schon gezählt (von einem anderen Gerät oder per Knopf), ist das
  // derselbe Satz, nur später erkannt → ignorieren.
  const since = lastMs == null ? Infinity : serverNow() - lastMs;
  if (since < VOICE_WINDOW_MS) {
    setVoiceUi('listening', `Schon gezählt (vor ${(since / 1000).toFixed(1)} s) – nicht doppelt.`);
    return;
  }
  doClick('voice');
}

function startVoice() {
  rec = new SR();
  rec.lang = 'de-DE';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  // Neuere Chrome-Versionen: Erkennung gezielt auf die Phrase trimmen (wird sonst ignoriert).
  if (usePhrases) {
    try {
      if ('phrases' in rec && window.SpeechRecognitionPhrase) rec.phrases = [new SpeechRecognitionPhrase('an der Stelle', 10)];
    } catch { usePhrases = false; }
  }
  counted = [];
  rec.onstart = () => setVoiceUi('listening', 'Hört zu … sag „an der Stelle“.');
  rec.onresult = ev => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      let best = 0, bestText = res[0].transcript;
      for (let a = 0; a < res.length; a++) {
        const h = countPhrase(res[a].transcript);
        if (h > best) { best = h; bestText = res[a].transcript; }
      }
      if (best > (counted[i] || 0)) {
        counted[i] = best;
        onPhrase(bestText);
      } else if (res.isFinal) {
        voiceHeard.textContent = `Gehört: „${res[0].transcript.trim()}“`;
      }
    }
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      voiceOn = false;
      stopMeter();
      setVoiceUi('error', 'Kein Mikrofon-Zugriff. Bitte im Browser erlauben.');
    } else if (ev.error === 'phrases-not-supported') {
      // Dieser Browser kann keine Phrasen-Hilfe → ohne sie neu starten (onend startet neu).
      usePhrases = false;
      localStorage.setItem('klicker-no-phrases', '1');
    } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
      setVoiceUi('error', 'Fehler: ' + ev.error + ' – starte neu …');
    }
  };
  // Chrome beendet die Erkennung regelmäßig von selbst – dann sofort neu starten.
  rec.onend = () => { if (voiceOn) setTimeout(() => { if (voiceOn) startVoice(); }, 150); };
  try { rec.start(); } catch (e) { console.error(e); }
}
</script>
</body>
</html>
